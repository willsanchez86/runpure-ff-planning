name: docs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Base commit
        # Empty on a branch's first push (GitHub sends all zeros) or when the earlier commit is gone (force push)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=""; fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Frozen ADRs unchanged
        if: env.BASE != ''
        run: node scripts/check-adr-immutability.mjs --base "$BASE"
      - name: Doc check (changes since base)
        if: env.BASE != ''
        run: node .claude/skills/doc-check/check.mjs --base "$BASE"
      - name: Doc check (whole repo; no earlier commit to compare)
        if: env.BASE == ''
        run: node .claude/skills/doc-check/check.mjs
